<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Streaming App</title>
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Custom CSS untuk Animasi dan Scrollbar */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212; /* Latar belakang gelap jika dibuka di desktop */
        }

        /* Sembunyikan scrollbar tapi tetap bisa scroll */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Animasi untuk chat baru masuk */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .chat-item {
            animation: slideIn 0.3s ease-out forwards;
        }

        /* Animasi untuk Gift Besar yang muncul di tengah */
        @keyframes popOut {
            0% { transform: scale(0.5); opacity: 0; }
            20% { transform: scale(1.1); opacity: 1; }
            80% { transform: scale(1); opacity: 1; transform: translateY(-30px); }
            100% { transform: scale(1); opacity: 0; transform: translateY(-50px); }
        }
        .gift-animation {
            animation: popOut 3s ease-in-out forwards;
        }

        /* Text shadow agar tulisan terbaca di atas video */
        .text-shadow {
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body class="flex justify-center items-center h-[100dvh] overflow-hidden">

    <!-- Container Utama dengan Rasio 9:16 Fix -->
    <div class="relative w-full max-w-[calc(100dvh*9/16)] max-h-full aspect-[9/16] bg-gray-900 shadow-2xl overflow-hidden text-white">
        
        <!-- Background Video -->
        <!-- Menggunakan video portrait gratis sebagai placeholder -->
        <video id="bg-video" 
               class="absolute top-0 left-0 w-full h-full object-cover z-0" 
               autoplay loop muted playsinline>
            <!-- Source akan diatur melalui JavaScript -->
        </video>

        <!-- Overlay Gelap (Opsional, agar teks lebih terbaca) -->
        <div class="absolute inset-0 bg-black/20 z-0"></div>

        <!-- AREA UI ATAS -->
        <div class="absolute top-0 left-0 w-full p-4 z-10">
            
            <!-- Baris 1: Profil Host & Penonton -->
            <div class="flex justify-between items-start">
                
                <!-- Profil Host (Kiri) -->
                <div class="flex flex-col gap-2">
                    <div class="flex items-center bg-black/40 backdrop-blur-sm rounded-full p-1 pr-3 shadow-lg">
                        <img id="host-avatar" src="" alt="Host" class="w-10 h-10 rounded-full border-2 border-yellow-400">
                        <div class="ml-2 flex flex-col justify-center">
                            <span id="host-name" class="text-sm font-bold leading-tight">Loading...</span>
                            <span class="text-[10px] text-gray-300 leading-tight">❤️ 89K | 👥 1,303</span>
                        </div>
                        <button class="ml-3 bg-cyan-400 text-black w-7 h-7 rounded-full flex justify-center items-center font-bold text-lg">+</button>
                    </div>

                    <!-- Koin & Bintang -->
                    <div class="flex gap-2 text-xs font-semibold">
                        <div class="bg-black/50 backdrop-blur-sm rounded-full px-3 py-1 flex items-center gap-1 shadow-md">
                            <span class="text-yellow-400">🪙</span> 3719796
                        </div>
                        <div class="bg-gradient-to-r from-pink-500 to-purple-500 rounded-full px-3 py-1 flex items-center gap-1 shadow-md">
                            🔥 4 Star
                        </div>
                    </div>
                </div>

                <!-- Penonton & Tombol Close (Kanan) -->
                <div class="flex items-center gap-2">
                    <div class="flex -space-x-2">
                        <img class="w-8 h-8 rounded-full border border-gray-800" src="https://i.pravatar.cc/150?img=32" alt="Viewer">
                        <img class="w-8 h-8 rounded-full border border-gray-800" src="https://i.pravatar.cc/150?img=12" alt="Viewer">
                        <img class="w-8 h-8 rounded-full border border-gray-800" src="https://i.pravatar.cc/150?img=5" alt="Viewer">
                    </div>
                    <div class="bg-black/40 rounded-full px-2 py-1 text-xs">499+</div>
                    <button class="w-8 h-8 bg-black/40 rounded-full flex justify-center items-center">
                        <i class="fa-solid fa-xmark text-white"></i>
                    </button>
                </div>
            </div>

            <!-- Top Gifts Panel (Kanan Atas) -->
            <div class="absolute top-14 right-4 bg-black/60 backdrop-blur-md rounded-xl p-2.5 w-36 text-xs shadow-lg border border-white/10">
                <div class="text-center font-bold mb-2 text-shadow text-[11px]">Top Gifts</div>
                <div class="flex justify-between items-center mb-1">
                    <span>Rina</span><span class="font-bold">🌹 20</span>
                </div>
                <div class="flex justify-between items-center mb-1">
                    <span>Bayu</span><span class="font-bold">🌹 6</span>
                </div>
                <div class="flex justify-between items-center mb-1">
                    <span>Dewi</span><span class="font-bold">🌹 2</span>
                </div>
                <div class="flex justify-between items-center">
                    <span>Vina</span><span class="font-bold">🌹 1</span>
                </div>
            </div>
        </div>

        <!-- AREA GIFT BANNER BESAR (Tengah Layar) -->
        <div id="big-gift-container" class="absolute top-1/3 left-0 w-full px-4 z-20 flex flex-col gap-2 pointer-events-none">
            <!-- Elemen ini akan diisi oleh JavaScript -->
        </div>

        <!-- Efek Masking Gradasi untuk Chat agar menghilang di atas -->
        <div class="absolute bottom-[60px] left-0 w-full h-[350px] bg-gradient-to-t from-black/80 via-black/30 to-transparent z-10 pointer-events-none"></div>

        <!-- AREA CHAT (Kiri Bawah) -->
        <div id="chat-container" class="absolute bottom-[70px] left-4 w-3/4 h-[250px] overflow-y-auto no-scrollbar flex flex-col justify-end pb-2 z-20 mask-chat">
            <div id="chat-messages" class="flex flex-col gap-1.5">
                <!-- Chat awal -->
                <div class="chat-item flex items-start gap-1.5 bg-black/30 backdrop-blur-sm p-1 rounded-lg w-max max-w-full">
                    <img src="https://i.pravatar.cc/150?img=1" class="w-5 h-5 rounded-full mt-0.5" alt="User">
                    <div>
                        <span class="font-bold text-xs text-gray-300">Sistem :</span>
                        <span class="text-xs text-white text-shadow">Selamat datang di live streaming! Be respectful.</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Like Animasi Mengambang di Kanan Bawah -->
        <div id="floating-likes" class="absolute bottom-[80px] right-4 w-12 h-40 pointer-events-none z-20 overflow-hidden relative">
            <!-- Likes akan digenerate via JS -->
        </div>

        <!-- AREA BOTTOM BAR (Input & Action) -->
        <div class="absolute bottom-0 left-0 w-full h-[60px] bg-gray-900/90 backdrop-blur-md px-4 flex items-center justify-between z-30 border-t border-white/10">
            <button class="text-yellow-400 text-2xl hover:scale-110 transition">
                <i class="fa-solid fa-face-smile"></i>
            </button>
            
            <div class="flex-1 mx-3 bg-gray-800 rounded-full h-10 flex items-center px-4">
                <span class="text-gray-400 text-sm">Ngobrol yuk...</span>
            </div>
            
            <div class="flex gap-4 text-xl text-white">
                <button class="hover:scale-110 transition"><i class="fa-solid fa-link"></i></button>
                <button class="hover:scale-110 transition"><i class="fa-solid fa-bars"></i></button>
                <button class="text-red-500 text-2xl hover:scale-110 transition drop-shadow-md">
                    <i class="fa-solid fa-gift"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==============================================================
        // KONFIGURASI UTAMA (SILAKAN UBAH DATA DI BAWAH INI)
        // ==============================================================
        const CONFIG = {
            namaAkun: "Syaboba",
            iconAkun: "https://i.pravatar.cc/150?img=47",
            fileVideo: "data.txt", // Nama file text di hosting yang berisi list link mp4 (pisahkan dengan enter)
            defaultVideo: "https://cdn.pixabay.com/video/2020/05/25/40141-424754388_large.mp4" // Video cadangan jika data.txt gagal dimuat
        };

        // --- INISIALISASI PROFIL ---
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('host-name').innerText = CONFIG.namaAkun;
            document.getElementById('host-avatar').src = CONFIG.iconAkun;
            setRandomVideo();
        });

        // --- FUNGSI AMBIL VIDEO RANDOM DARI DATA.TXT ---
        async function setRandomVideo() {
            const videoPlayer = document.getElementById('bg-video');
            try {
                // Fetch file data.txt dari server. Tambah 'cache-busting' (waktu) agar selalu update
                const response = await fetch(CONFIG.fileVideo + "?t=" + new Date().getTime()); 
                if (!response.ok) throw new Error("File tidak ditemukan");
                
                const textData = await response.text();
                // Pisahkan tiap baris, hapus spasi ekstra, dan buang baris kosong
                const videoList = textData.split('\n').map(link => link.trim()).filter(link => link !== "");
                
                if (videoList.length > 0) {
                    // Pilih random dari list
                    const randomLink = videoList[Math.floor(Math.random() * videoList.length)];
                    videoPlayer.src = randomLink;
                } else {
                    // Jika file kosong, gunakan default
                    videoPlayer.src = CONFIG.defaultVideo;
                }
            } catch (error) {
                console.error("Gagal mengambil list video (mungkin karena diblokir jika buka di lokal tanpa server):", error);
                videoPlayer.src = CONFIG.defaultVideo; // fallback jika error
            }
            videoPlayer.load();
        }

        // --- DATA DUMMY ---
        const userNames = ["Bayu", "Dewi", "Vina", "Jeremy", "Budi", "Siti", "Andi", "Ratna"];
        const chatMessages = [
            "support kak", 
            "mantap live", 
            "hadir kak 🔥", 
            "lagi dimana ini?", 
            "keren banget!", 
            "salam dari binjai", 
            "follback dong kak", 
            "😍😍😍",
            "lanjutkan kak!"
        ];
        const gifsData = [
            { name: "Dewi", img: "https://i.pravatar.cc/150?img=32", item: "🌹", itemName: "Mawar", qty: 1, type: "small" },
            { name: "Jeremy", img: "https://i.pravatar.cc/150?img=11", item: "🏎️", itemName: "Super Car", qty: 1, type: "big" },
            { name: "Bayu", img: "https://i.pravatar.cc/150?img=12", item: "👑", itemName: "Mahkota", qty: 1, type: "small" }
        ];

        // --- FUNGSI FAKE CHAT ---
        const chatContainer = document.getElementById('chat-container');
        const chatMessagesDiv = document.getElementById('chat-messages');

        function addRandomChat() {
            const randomName = userNames[Math.floor(Math.random() * userNames.length)];
            const randomMsg = chatMessages[Math.floor(Math.random() * chatMessages.length)];
            const randomImg = `https://i.pravatar.cc/150?img=${Math.floor(Math.random() * 70)}`;
            const isLevelUp = Math.random() > 0.8; // 20% chance ada badge level

            const levelBadge = isLevelUp ? `<span class="bg-yellow-500 text-black text-[9px] px-1 rounded-sm mr-1 font-bold">Lv.${Math.floor(Math.random()*50)+1}</span>` : '';

            const chatHTML = `
                <div class="chat-item flex items-start gap-1.5 bg-black/30 backdrop-blur-sm p-1 rounded-lg w-max max-w-[90%]">
                    <img src="${randomImg}" class="w-5 h-5 rounded-full mt-0.5 border border-gray-600" alt="${randomName}">
                    <div class="leading-tight">
                        ${levelBadge}
                        <span class="font-bold text-xs text-gray-200">${randomName} :</span>
                        <span class="text-xs text-white text-shadow ml-1">${randomMsg}</span>
                    </div>
                </div>
            `;

            chatMessagesDiv.insertAdjacentHTML('beforeend', chatHTML);
            
            // Hapus chat lama agar DOM tidak berat (maksimal 30 chat)
            if (chatMessagesDiv.children.length > 30) {
                chatMessagesDiv.removeChild(chatMessagesDiv.firstElementChild);
            }

            // Auto scroll ke bawah
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Jalankan chat setiap 1-3 detik
        setInterval(addRandomChat, Math.floor(Math.random() * 2000) + 1000);

        // --- FUNGSI FAKE BIG GIFTS (Banner di tengah) ---
        const bigGiftContainer = document.getElementById('big-gift-container');

        function showRandomGift() {
            const gift = gifsData[Math.floor(Math.random() * gifsData.length)];
            
            let giftHTML = '';
            if(gift.type === 'small') {
                giftHTML = `
                <div class="gift-animation flex items-center bg-black/70 backdrop-blur-md rounded-full p-2 w-max shadow-xl border border-yellow-500/30">
                    <img src="${gift.img}" class="w-10 h-10 rounded-full border-2 border-yellow-400 mr-3">
                    <div class="flex flex-col mr-6">
                        <span class="font-bold text-white text-shadow">${gift.name}</span>
                        <span class="text-xs text-yellow-300">Kirim ${gift.itemName}</span>
                    </div>
                    <div class="text-4xl drop-shadow-lg mr-2">${gift.item}</div>
                    <div class="text-2xl font-bold text-yellow-400 italic text-shadow">x${gift.qty}</div>
                </div>
                `;
            } else {
                giftHTML = `
                <div class="gift-animation flex flex-col items-center justify-center p-4">
                    <div class="flex items-center gap-2 mb-2 bg-black/50 px-4 py-1 rounded-full">
                        <img src="${gift.img}" class="w-6 h-6 rounded-full">
                        <span class="font-bold text-yellow-400 text-sm text-shadow">${gift.name}</span>
                        <span class="text-white text-sm">Mengirim ${gift.itemName}</span>
                    </div>
                    <div class="text-7xl drop-shadow-2xl" style="filter: drop-shadow(0 0 20px rgba(255,0,0,0.8));">${gift.item}</div>
                </div>
                `;
            }

            bigGiftContainer.innerHTML = giftHTML;

            // Hapus elemen setelah animasi selesai (3 detik)
            setTimeout(() => {
                bigGiftContainer.innerHTML = '';
            }, 3000);
        }

        // Munculkan gift setiap 5-10 detik
        setInterval(showRandomGift, Math.floor(Math.random() * 5000) + 5000);

        // --- FUNGSI FLOATING LIKES (Kanan Bawah) ---
        const floatingLikesContainer = document.getElementById('floating-likes');
        const likeColors = ['#ff3b30', '#ff9500', '#ffcc00', '#4cd964', '#5ac8fa', '#007aff', '#5856d6', '#ff2d55'];

        function createFloatingLike() {
            const like = document.createElement('div');
            like.innerHTML = '❤';
            const color = likeColors[Math.floor(Math.random() * likeColors.length)];
            
            // Randomize posisi x sedikit
            const randomX = Math.floor(Math.random() * 20) - 10;
            
            like.style.color = color;
            like.style.position = 'absolute';
            like.style.bottom = '0';
            like.style.left = '50%';
            like.style.fontSize = '24px';
            like.style.opacity = '1';
            like.style.textShadow = '0 0 5px rgba(0,0,0,0.5)';
            like.style.transform = `translateX(-50%) translateX(${randomX}px)`;
            like.style.transition = 'transform 2s ease-out, opacity 2s ease-out, bottom 2s ease-out';
            
            floatingLikesContainer.appendChild(like);

            // Animasikan ke atas
            setTimeout(() => {
                like.style.bottom = '100%';
                like.style.opacity = '0';
                like.style.transform = `translateX(-50%) translateX(${randomX * 3}px) scale(1.5)`;
            }, 50);

            // Hapus setelah selesai
            setTimeout(() => {
                like.remove();
            }, 2000);
        }

        // Trigger like sesekali (simulasi penonton tap layar)
        setInterval(() => {
            if(Math.random() > 0.3) {
                createFloatingLike();
                // Kadang muncul multiple like
                if(Math.random() > 0.7) setTimeout(createFloatingLike, 100);
            }
        }, 800);

        // --- ARRAY MULTIPLE VIDEO (Opsional) ---
        // Jika ingin ganti video saat di klik
        const videos = [
            "https://cdn.pixabay.com/video/2020/05/25/40141-424754388_large.mp4",
            "https://cdn.pixabay.com/video/2023/10/22/186007-877239304_large.mp4",
            "https://cdn.pixabay.com/video/2021/08/11/84687-586716982_large.mp4"
        ];
        
        /* Uncomment fungsi di bawah ini jika ingin video berganti saat background di klik/swipe
        document.getElementById('bg-video').addEventListener('click', () => {
            const currentSrc = document.getElementById('bg-video').querySelector('source').src;
            let nextVid = videos[Math.floor(Math.random() * videos.length)];
            while(nextVid === currentSrc) nextVid = videos[Math.floor(Math.random() * videos.length)];
            
            const videoElement = document.getElementById('bg-video');
            videoElement.querySelector('source').src = nextVid;
            videoElement.load();
            videoElement.play();
        });
        */
    </script>
</body>
</html>
